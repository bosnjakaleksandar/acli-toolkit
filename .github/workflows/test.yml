name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Full suite (typecheck + node:test, including .test.ts files) requires
    # Node's native TypeScript type-stripping, stable since Node 22.18.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22.18.0]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  dist-smoke:
    # Verify the built artifact on the exact declared runtime floor.
    # the built dist/ actually runs on the declared floor version — this
    # doesn't need native TS execution, just tsc + node running plain JS.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node bin/acli --help
      - run: CI=1 node bin/acli doctor
      - run: CI=1 node bin/acli create --dry-run --yes --name smoke-test --type application --framework react --environment docker

  docs:
    # docs.yml only builds (and deploys) on push to main, so a docs-breaking
    # change is otherwise discovered after it has already landed. This job
    # builds only — deployment stays in docs.yml — so a PR fails here first.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm

      - run: npm ci
      - run: npm run docs:build
