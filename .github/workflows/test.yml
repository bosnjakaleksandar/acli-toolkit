name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Full suite (typecheck + node:test, including .test.ts files) requires
    # Node's native TypeScript type-stripping, stable since Node 22.18.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  dist-smoke:
    # The published artifact is plain compiled JS (engines >=20), so verify
    # the built dist/ actually runs on the declared floor version — this
    # doesn't need native TS execution, just tsc + node running plain JS.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node bin/acli --help
      - run: CI=1 node bin/acli doctor
      - run: CI=1 node bin/acli create --dry-run --yes --name smoke-test --type application --framework react --environment docker

  docs:
    # docs.yml only builds (and deploys) on push to main, so a docs-breaking
    # change is otherwise discovered after it has already landed. This job
    # builds only — deployment stays in docs.yml — so a PR fails here first.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run docs:build
