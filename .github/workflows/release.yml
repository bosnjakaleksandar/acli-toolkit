name: Release

# Fires on an annotated version tag (e.g. v2.0.0) pushed to the repo — it does
# not run on every push to a branch, so merging to main or pushing to
# refactor never triggers a publish attempt on its own.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  # Required for npm provenance: lets npm attach a signed, publicly verifiable
  # attestation (via Sigstore) proving this exact tarball was built by this
  # exact workflow run from this exact commit, without needing a long-lived
  # signing key stored as a secret.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (not the default shallow clone) is required for the
          # merge-base ancestry check below.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      # npm Trusted Publishing (OIDC) needs npm CLI >=11.5.0 — newer than
      # what Node 22's bundled npm ships. `npm ci`/`npm test` above still run
      # under the Node-bundled npm; only the publish step needs the upgrade.
      - run: npm install -g npm@latest

      # A tag matching v*.*.* triggers this workflow regardless of which
      # commit it points at — without this check, anyone able to push a tag
      # could publish a release built from a commit that never went through
      # a reviewed PR into main. Requires the fetch-depth: 0 checkout above.
      - name: Verify the tagged commit is reachable from main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not an ancestor of main. Refusing to publish."
            exit 1
          fi

      # Fails clearly if package.json's version doesn't match the pushed tag,
      # instead of silently publishing whatever version happens to be checked
      # in — a tag is supposed to be the deliberate trigger for a specific
      # release, not just "whatever's on this commit".
      - name: Verify package.json version matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret
      # needed. npm exchanges this job's GitHub Actions OIDC token
      # (id-token: write, granted above) for a short-lived publish
      # credential, scoped to this exact repo + workflow file, with no
      # long-lived secret stored anywhere. Requires a one-time, manual setup
      # step this workflow file cannot do on its own: on npmjs.com, under
      # the `acli-toolkit` package's Settings → Trusted Publisher, add a
      # GitHub Actions publisher pointing at this repo and at
      # `.github/workflows/release.yml`. Until that's configured, this step
      # fails outright (no fallback) — do the npmjs.com setup, publish a
      # prerelease tag (e.g. v2.0.1-rc.1) to confirm it works, and only then
      # remove the now-unused NPM_TOKEN secret from the repo.
      - run: npm publish --provenance
