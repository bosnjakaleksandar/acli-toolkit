name: Release

# Fires on an annotated version tag (e.g. v2.0.0) pushed to the repo — it does
# not run on every push to a branch, so merging to main or pushing to
# refactor never triggers a publish attempt on its own.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  # Required for npm provenance: lets npm attach a signed, publicly verifiable
  # attestation (via Sigstore) proving this exact tarball was built by this
  # exact workflow run from this exact commit, without needing a long-lived
  # signing key stored as a secret.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (not the default shallow clone) is required for the
          # merge-base ancestry check below.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Staged publishing through Trusted Publishing (OIDC) needs npm
      # >=11.20 — newer than Node 22's bundled npm. npm 12 no longer supports
      # Node 22.18, so stay on 11. `npm ci`/`npm test` above still run under
      # the Node-bundled npm; only the publish step needs the upgrade.
      - run: npm install -g npm@^11.20.0

      # A tag matching v*.*.* triggers this workflow regardless of which
      # commit it points at — without this check, anyone able to push a tag
      # could publish a release built from a commit that never went through
      # a reviewed PR into main. Requires the fetch-depth: 0 checkout above.
      - name: Verify the tagged commit is reachable from main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not an ancestor of main. Refusing to publish."
            exit 1
          fi

      # Fails clearly if package.json's version doesn't match the pushed tag,
      # instead of silently publishing whatever version happens to be checked
      # in — a tag is supposed to be the deliberate trigger for a specific
      # release, not just "whatever's on this commit".
      - name: Verify package.json version matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Stages the release via npm Trusted Publishing (OIDC): no token is
      # stored anywhere. npm exchanges this job's GitHub Actions OIDC token
      # (id-token: write, granted above) for a short-lived credential scoped
      # to this repo + workflow file (configured on npmjs.com under the
      # package's Settings → Trusted Publisher). The trusted publisher may
      # only *stage*: the version stays private until a maintainer approves
      # it with 2FA — `npm stage list acli-toolkit`, then
      # `npm stage approve <stage-id>` (or on npmjs.com). A compromised
      # workflow therefore can't publish on its own.
      - run: npm stage publish --provenance
