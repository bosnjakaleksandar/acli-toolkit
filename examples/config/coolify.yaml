version: 1
profiles:
  coolify-staging:
    type: wordpress
    # The server only exposes the `project` CLI (Coolify staging): A-CLI runs
    # the read-only `project list|status|db-export|wp-export` subcommands over
    # SSH, downloads the exports with scp and unpacks them locally. It never
    # runs wp-import, db-import, branch, deploy or any other state-changing
    # subcommand.
    provider: coolify-cli
    ssh:
      host: staging.example.com
      username: developer
      identityFile: ~/.ssh/staging
    # No project here: a profile describes the server. `acli import` lists
    # the server's projects (or takes one as an argument), and each project's
    # .acli/config.yaml remembers its server name and prompt answers.
    # coolify:
    #   gitHost: github.com   # host for the SSH Git origin from `project status`
    git:
      enabled: true
      # sshHostAlias: github-work
    urls:
      staging: "https://{projectName}.staging.example.com"
